server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve a branded page for every unknown URL while preserving HTTP 404.
    error_page 404 /404.html;

    # Keep crawler resources public and return the correct content types.
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
